<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-ESRAD</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
    <a class="navbar-brand" href="index.html" id="astrodata-brand">
      AI-ESRAD <img src="images/a.jpg" alt="Astronaut" id="astrodata-image">
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item active"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="info.html">Info</a></li>
      </ul>
    </div>
  </nav>

  <!-- Title -->
  <div class="ai-heading">
    AI-Enhanced Super Resolution <br> for Astronomical Data
  </div>

  <!-- Upload Section -->
  <section class="upload-section">
    <div class="container text-center">
      <h2 class="upload-title">Upload Your Low-Resolution Space Image</h2>
      <p class="upload-subtext">
        Transform your image into a high-resolution telescopic view using AI 🚀
      </p>

      <!-- Upload Form -->
      <form id="upload-form" enctype="multipart/form-data">
        <input type="file" id="inputImage" name="image" accept="image/*" class="form-control-file mb-3" required>
        <button type="submit" class="btn btn-primary upload-btn">Enhance Image</button>
      </form>

      <!-- Image Preview Section -->
      <div class="row mt-5 justify-content-center">
        <div class="col-md-5">
          <h4>Original Image</h4>
          <div class="image-box">
            <img id="previewInput" src="#" alt="Input Preview" class="img-fluid d-none">
          </div>
        </div>
        <div class="col-md-5">
          <h4>Enhanced Image</h4>
          <div class="image-box">
            <img id="previewOutput" src="#" alt="Output Preview" class="img-fluid d-none">
            <div id="processingText" class="processing-text d-none">Processing with AI...</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <script>
    // JS for preview before upload
    const input = document.getElementById('inputImage');
    const previewInput = document.getElementById('previewInput');

    input.addEventListener('change', () => {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          previewInput.src = e.target.result;
          previewInput.classList.remove('d-none');
        };
        reader.readAsDataURL(file);
      }
    });

    // Placeholder for backend call later
    const form = document.getElementById('upload-form');
    const outputPreview = document.getElementById('previewOutput');
    const processingText = document.getElementById('processingText');

    form.addEventListener('submit', e => {
      e.preventDefault();
      processingText.classList.remove('d-none');
      outputPreview.classList.add('d-none');

      // Later you’ll replace this with a backend API call
      setTimeout(() => {
        processingText.classList.add('d-none');
        outputPreview.src = 'images/sample_highres.jpg'; // demo placeholder
        outputPreview.classList.remove('d-none');
      }, 2500);
    });
  </script>
</body>
</html>
